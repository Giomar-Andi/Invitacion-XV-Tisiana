<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Conexión - XV Años Antonella</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #E8DFF5 0%, #D4C4E8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .offline-container {
            max-width: 500px;
        }
        
        .offline-icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }
        
        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: #6B4E71;
            margin-bottom: 20px;
        }
        
        p {
            color: #4A2C5E;
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        
        .btn-retry {
            background: linear-gradient(135deg, #D4AF37 0%, #FFD700 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.4);
            transition: transform 0.3s ease;
        }
        
        .btn-retry:hover {
            transform: translateY(-3px);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📴</div>
        <h1>Sin Conexión</h1>
        <p>
            Parece que no tienes conexión a internet.<br>
            La invitación ya fue cargada y puedes verla sin conexión.
        </p>
        <a href="/" class="btn-retry">Intentar de Nuevo</a>
    </div>
</body>
</html>
