<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin Conexión · Antonella</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f0f7;
            padding: 1.5rem;
        }
        .offline-card {
            max-width: 480px;
            width: 100%;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 0 20px 60px rgba(74,44,94,0.08);
            border: 1px solid rgba(255,255,255,0.5);
            transition: transform 0.3s ease;
        }
        .offline-card:hover { transform: translateY(-4px); }
        .offline-icon { font-size: 4rem; display:block; margin-bottom:0.5rem; }
        .offline-title {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: #4a2c5e;
        }
        .offline-sub {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #9b7cb6;
            margin-bottom: 1rem;
        }
        .offline-divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #d4af37, #ffd700);
            margin: 0 auto 1.5rem;
            border-radius: 4px;
        }
        .offline-message {
            font-size: 1rem;
            line-height: 1.8;
            color: #2d1b3d;
            margin-bottom: 1.8rem;
        }
        .offline-message strong { color: #d4af37; }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, #d4af37, #ffd700);
            color: #fff;
            padding: 0.8rem 2.5rem;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(212,175,55,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .btn-retry:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 40px rgba(212,175,55,0.4);
        }
        @media (max-width: 500px) {
            .offline-card { padding: 2rem 1.2rem; }
            .offline-title { font-size: 2.4rem; }
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <span class="offline-icon">📴</span>
        <h1 class="offline-title">Sin Conexión</h1>
        <p class="offline-sub">✦ Modo offline ✦</p>
        <div class="offline-divider"></div>
        <p class="offline-message">
            Parece que no tienes internet.<br />
            Pero no te preocupes, <strong>la invitación ya está cargada</strong><br />
            y puedes disfrutarla sin conexión.
        </p>
        <a href="/" class="btn-retry">🔄 Intentar de Nuevo</a>
    </div>
</body>
</html>
